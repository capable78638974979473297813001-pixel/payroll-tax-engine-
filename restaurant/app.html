'use strict';
const $=s=>document.querySelector(s),root=$('#root');let state=null,view='home',step=0,review=null,result=null,busy=false,draft={entries:[],periodStart:'',periodEnd:'',checkDate:''};let saveTimer;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((c||0)/100);
const date=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'—';
const today=()=>new Date().toLocaleDateString('en-CA');const addDays=(d,n)=>{const v=new Date(d+'T12:00:00');v.setDate(v.getDate()+n);return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`};
const company=()=>state?.companies[0];const team=()=>state?.employees??[];const runs=()=>state?.runs.filter(r=>r.status==='approved').sort((a,b)=>b.checkDate.localeCompare(a.checkDate))??[];
const icon={home:'◫',payroll:'↗',team:'♧',integrations:'⊞',history:'≡',settings:'⚙'};
function toast(message){$('#notice').innerHTML=`<div class="toast" role="status">${esc(message)}</div>`;setTimeout(()=>$('#notice').innerHTML='',4500)}
async function api(path,data){const response=await fetch('/api/'+path,{method:data===undefined?'GET':'POST',headers:data===undefined?{}:{'Content-Type':'application/json','X-Restaurant-Csrf':state?.csrf??''},body:data===undefined?undefined:JSON.stringify(data)});const value=await response.json();if(!response.ok){if(response.status===401&&state){state=null;authPage(false)}throw new Error(value.error||'Please try again.')}return value}
async function load(){state=await api('workspace');const saved=await api('draft');draft=saved.draft??{entries:[]};ensureDraft();render()}
function ensureDraft(){if(!company())return;draft.periodStart=draft.periodStart||company().paySchedule.anchorPeriodStart;draft.periodEnd=draft.periodEnd||addDays(draft.periodStart,company().paySchedule.frequency==='weekly'?6:13);draft.checkDate=draft.checkDate||addDays(draft.periodEnd,5);draft.entries=team().map(e=>draft.entries?.find(x=>x.employeeId===e.id)??{employeeId:e.id,regularHours:0,overtimeHours:0,cashTipsCents:0,paycheckTipsCents:0,serviceChargesCents:0,hoursReviewed:false,tipsReviewed:false})}
function saveDraft(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>api('draft',draft).then(()=>{if($('#saved'))$('#saved').textContent='Draft saved'}).catch(e=>toast(e.message)),600);review=null}
function landing(){history.replaceState(null,'','/');root.innerHTML=`<div class="landing"><nav class="landnav"><a class="brand" href="/"> <i>✳</i> omnia<span style="font-size:10px;letter-spacing:1px;margin:7px 0 0 7px">RESTAURANT</span></a><div class="links"><a href="#how">How it works</a><a href="#connections">Your tools</a><a href="#people">Built for restaurants</a></div><div class="row"><button class="btn text" data-action="login">Log in</button><button class="btn primary" data-action="signup">Get started <span>↗</span></button></div></nav><section class="landhero"><div><div class="eyebrow"><span class="dot"></span> For the people behind the service</div><h1>A full house.<br>A happy team.<br><em>A simpler payday.</em></h1><p>You take care of your guests. Give your people the same care, with a calmer way to bring hours, tips and payroll together.</p><div class="row"><button class="btn primary" data-action="signup">Build your workspace <span>↗</span></button><a class="btn text" href="#how">Take a look ↓</a></div><div class="hint" style="margin-top:19px">One restaurant. One team. Everything in its place.</div></div><div class="preview" aria-label="Illustrative payroll preview"><div class="previewtop"><span class="brand" style="font-size:20px"><i>✳</i> omnia</span><span class="pill">Payroll overview</span></div><div class="previewbody"><div class="tag">Juniper Kitchen · Weekly payroll</div><h2 style="margin-top:12px">Looking after your people.</h2><div class="paytotal">$8,426<span style="font-size:23px;color:#9aa78d">.50</span></div><div class="row between" style="margin-bottom:22px"><span class="muted">12 people · Oct 19–25</span><span class="pill">Ready for review</span></div>${[['MC','Maya Chen','Line cook','$960.00'],['JR','Jordan Reed','Server','$842.50'],['AR','Alex Rivera','Bar lead','$1,120.00']].map(x=>`<div class="previewperson"><span class="avatar">${x[0]}</span><div><h3 style="font-size:12px">${x[1]}</h3><small>${x[2]}</small></div><strong>${x[3]}</strong></div>`).join('')}<div class="btn primary" style="width:100%;margin-top:16px">Review payroll <span>→</span></div></div><span class="sample">ILLUSTRATIVE PREVIEW · NOT LIVE PAYROLL DATA</span></div></section><section class="logos" id="connections"><div class="tag">Keep the tools your restaurant knows</div><div class="logorow"><span>◩ Square</span><span>toast</span><span>Clover</span><span>7shifts</span><span>Homebase</span></div><p class="hint" style="margin-top:18px">Square and Toast labor adapters require API access. Other tools connect through CSV.</p></section><section class="section" id="how"><div class="tag">Less admin. More hospitality.</div><h2>A better rhythm,<br><span class="serif">from shift to payday.</span></h2><div class="features"><article class="feature"><div class="n">01 / Gather</div><h3>Your shifts, together.</h3><p>Bring in labor from your POS or a simple spreadsheet. Match each person once, then check the hours that matter.</p></article><article class="feature"><div class="n">02 / Review</div><h3>Clarity before approval.</h3><p>Review wages, overtime and reported tips in one place. See what needs attention before anything is recorded.</p></article><article class="feature"><div class="n">03 / Keep track</div><h3>A record you can return to.</h3><p>Save your progress, review the calculation and keep a payroll history with a downloadable register.</p></article></div></section><section class="section" id="people" style="padding-top:0"><div class="landcta"><div><div class="tag" style="color:#b4c7aa;margin-bottom:12px">Made for independent restaurants</div><h2>Your next chapter.<br><span class="serif">With your people at the heart.</span></h2></div><button class="btn lime" data-action="signup">Get your restaurant set up ↗</button></div><p class="hint" style="margin-top:18px">This release calculates and records payroll. Bank transfers and tax filing require a payment and filing provider. Tipped payroll is held for specialist processing until its tax rules are supported.</p></section><footer class="landfooter"><span class="brand" style="font-size:19px">✳ omnia</span><span>Built around the people who make your restaurant.</span><button class="btn text" data-action="login">Workspace login ↗</button></footer></div>`}
function authPage(signup){history.replaceState(null,'',signup?'/signup':'/login');root.innerHTML=`<div class="authscreen"><aside class="authstory"><a class="brand" href="/" style="color:#fff"><i style="color:#d9edb5">✳</i> omnia</a><div><div class="tag" style="color:#b5caaa;margin-bottom:24px">Restaurant payroll, thoughtfully made</div><h1>Great hospitality<br>starts with<br>your people.</h1><p>A quieter corner for the business of running your restaurant. Your team, your hours, your next payday.</p></div><small style="color:#b5caaa">A little less admin. A little more room to breathe.</small></aside><main class="authform"><div class="authinner"><a class="mobilebrand brand" href="/">✳ omnia</a><div class="tag" style="margin-bottom:15px">Your restaurant workspace</div><h2>${signup?'A fresh start.':'Welcome back.'}</h2><p class="muted">${signup?'Let’s make room for a better payday.':'Good to have you here. Sign in to continue.'}</p><form id="authform">${signup?'<label>Your name<input name="name" autocomplete="name" maxlength="100" required></label>':''}<label>Email address<input type="email" name="email" autocomplete="email" maxlength="254" required></label><label>Password<input type="password" name="password" autocomplete="${signup?'new-password':'current-password'}" minlength="${signup?12:1}" maxlength="128" required></label>${signup?'<small>Use at least 12 characters.</small>':''}<div id="formerror" role="alert"></div><button class="btn primary" type="submit">${signup?'Create your workspace':'Sign in'} <span>→</span></button></form><p style="margin-top:25px;font-size:12px" class="muted">${signup?'Already have a workspace?':'New here?'} <button class="btn text" style="padding:4px" data-action="${signup?'login':'signup'}">${signup?'Sign in':'Get started'}</button></p><p class="hint" style="margin-top:25px">${signup?'Email verification and password recovery are not yet available. Keep your password safe.':'Need help accessing your account? Contact your workspace administrator.'}</p></div></main></div>`;$('#authform').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const d=Object.fromEntries(new FormData(e.target));await api('auth/'+(signup?'signup':'login'),d);view='home';await load();history.replaceState(null,'','/app')}catch(err){$('#formerror').innerHTML=`<div class="alert error">${esc(err.message)}</div>`}finally{b.disabled=false}}}
function shell(content){const c=company();root.innerHTML=`<div class="shell"><aside class="sidebar"><a class="brand" href="/"> <i>✳</i> omnia</a><div class="restaurant"><strong>${esc(c?.legalName||'Your restaurant')}</strong><small>${esc(c?.homeState||'Set up your workspace')} · Restaurant workspace</small></div><div class="nav">${[['home','Overview'],['payroll','Run payroll'],['team','Your people'],['integrations','Connections'],['history','Payroll history']].map(([id,label])=>`<button data-view="${id}" class="${view===id?'active':''}"><span class="ico">${icon[id]}</span>${label}${id==='payroll'?'<span style="margin-left:auto">↗</span>':''}</button>`).join('')}</div><div class="sidebottom"><div class="card" style="padding:16px;background:#f6f8f0;font-size:12px"><strong>A little clarity.</strong><p class="muted" style="font-size:11px;margin-top:6px">Payroll records, payments and tax filings have separate statuses.</p></div><div class="nav" style="margin-top:20px"><button data-view="settings"><span class="ico">⚙</span>Settings</button><button data-action="logout"><span class="ico">↪</span>Sign out</button></div></div></aside><main class="main"><header class="topbar"><span class="muted">Your restaurant, in good order.</span><div class="row"><span style="font-size:12px">${esc(state.user.name.split(' ')[0])}</span><span class="avatar">${esc(state.user.name.slice(0,2).toUpperCase())}</span><button class="btn text" data-action="logout" style="padding:4px" aria-label="Sign out">↪</button></div></header><div class="content">${content}</div></main></div>`}
function title(k,h,p,action=''){return `<div class="heading row between"><div><div class="tag" style="margin-bottom:11px">${k}</div><h1>${h}</h1><p>${p}</p></div>${action}</div>`}
function render(){if(!state)return;ensureDraft();if(!company()){shell(setup());bindSetup();return}shell(({home:dashboard,payroll:payrollPage,team:teamPage,integrations:integrationPage,history:historyPage,settings:settingsPage}[view]||dashboard)());bindView()}
function setup(){return title('Let’s get acquainted','Make yourself at home.','Three details to shape your restaurant workspace.')+`<div class="card" style="max-width:650px"><form id="setupform" class="stack"><div class="fields"><label class="full">Restaurant name<input name="name" placeholder="Juniper Kitchen" maxlength="120" required></label><label>Work state<select name="state">${stateOptions('MI')}</select></label><label>Pay schedule<select name="frequency"><option value="weekly">Every week</option><option value="biweekly">Every two weeks</option></select></label><label class="full">First pay period starts<input name="anchor" type="date" value="${today()}" required></label></div><div class="alert">You’ll add your employer details and people next. This workspace records payroll; bank transfers and tax filings are not connected.</div><div id="formerror"></div><button class="btn primary" type="submit">Create restaurant workspace →</button></form></div>`}
function bindSetup(){$('#setupform').onsubmit=async e=>{e.preventDefault();await submit(e,async()=>{await api('setup',Object.fromEntries(new FormData(e.target)));await load()})}}
function dashboard(){const last=runs()[0],gross=last?.lines.reduce((s,l)=>s+l.grossPay,0)||0;const totalHours=draft.entries.reduce((s,e)=>s+e.regularHours+e.overtimeHours,0);const reviewed=draft.entries.filter(e=>e.hoursReviewed&&e.tipsReviewed).length;return title('Your overview',`Good to see you, ${esc(state.user.name.split(' ')[0])}.`,'A clear view of your team and the next payday.',`<button class="btn primary" data-view="payroll">Run payroll ↗</button>`)+`<div class="hero-pay"><div><div class="tag">Next payroll · ${esc(company().paySchedule.frequency)}</div><h2>${date(draft.periodStart)} – ${date(draft.periodEnd)}</h2><span class="muted">Pay date ${date(draft.checkDate)} · ${team().length} people</span></div><div class="right"><div><div class="tag">Your progress</div><div class="big">${reviewed}<span style="font-size:17px;color:#819375"> / ${team().length} reviewed</span></div><small>${totalHours.toFixed(1)} hours in this draft</small></div><button class="btn primary" data-view="payroll">${totalHours?'Continue':'Prepare'} payroll →</button></div></div><div class="stats"><div class="card stat"><div class="tag">Your people</div><div class="num">${team().length}</div><small>Team members</small></div><div class="card stat"><div class="tag">Last gross payroll</div><div class="num">${money(gross)}</div><small>${last?date(last.checkDate):'No recorded payroll yet'}</small></div><div class="card stat"><div class="tag">Connected tools</div><div class="num">${state.integrations.filter(p=>p.configured).length}</div><small>Configured API adapters</small></div></div><div class="twocol"><div class="card"><div class="row between"><h3>Let’s get ready for payday</h3><span class="pill gray">Next steps</span></div>${[[company().hasEin?'✓':'!','Confirm your employer details',company().hasEin?'Employer EIN saved':'Add your EIN before calculation','settings'],['1','Bring your people together',team().length?`${team().length} team members in your workspace`:'Add your team and their hourly rates','team'],['2','Gather hours and tips','Import from your POS, upload a CSV or enter hours','payroll'],['3','Check the details','Review the calculation before recording payroll','payroll']].map(x=>`<div class="task"><span class="circle">${x[0]}</span><div><strong style="font-size:13px">${x[1]}</strong><p>${x[2]}</p></div><button class="btn text" data-view="${x[3]}" aria-label="${x[1]}">↗</button></div>`).join('')}</div><div class="card"><div class="row between"><h3>Your team at a glance</h3><button class="btn text" style="padding:0" data-view="team">View all ↗</button></div>${['Front of house','Back of house'].map(d=>{const n=team().filter(e=>e.department===d).length;return `<div style="margin-top:25px"><div class="row between" style="margin-bottom:9px"><span style="font-size:12px">${d}</span><small>${n} people</small></div><div class="bar"><span style="width:${team().length?n/team().length*100:0}%"></span></div></div>`}).join('')}<p class="hint" style="margin-top:28px">Good service starts with a team that feels looked after.</p></div></div>`}
function payrollPage(){if(!team().length)return title('Payroll','Start with your people.','Add your team before preparing your first payroll.')+`<div class="card empty"><h2>Who’s behind your service?</h2><p>Add each employee’s rate and employment details.</p><button class="btn primary" data-action="addemployee">Add your first person →</button></div>`;return title('Payroll',step===2?'Payroll recorded.':'A simpler payday.',step===2?'Your register is saved. Payment and filing are still outstanding.':'Gather the details. Check the numbers. Give it your approval.')+`<div class="steps">${['Hours & tips','Review payroll','Recorded'].map((s,i)=>`<div class="step ${step===i?'active':''}"><b>${i<step?'✓':i+1}</b>${s}</div>`).join('')}</div>`+(step===0?hoursPage():step===1?reviewPage():donePage())}
function hoursPage(){return `<div class="card" style="margin-bottom:22px"><div class="row between" style="margin-bottom:20px"><h3>Your pay period</h3><small id="saved">Draft saved as you work</small></div><div class="fields" style="grid-template-columns:repeat(3,1fr)">${[['periodStart','Period starts'],['periodEnd','Period ends'],['checkDate','Pay date']].map(([id,label])=>`<label>${label}<input type="date" data-date="${id}" value="${esc(draft[id])}" required></label>`).join('')}</div></div><div class="card" style="padding:0;overflow:hidden"><div class="row between" style="padding:22px 24px;flex-wrap:wrap"><div><h3>Hours, overtime & tips</h3><small>Enter hours for this period. Tips are dollars.</small></div><div class="row"><button class="btn" data-action="import">Import hours ↓</button><button class="btn text" data-action="template">CSV template ↗</button></div></div><div class="scroll"><table><thead><tr><th>Person</th><th>Regular h</th><th>OT h</th><th>Cash tips<br>already paid</th><th>Tips in<br>paycheck</th><th>Service<br>charges</th><th>Reviewed</th></tr></thead><tbody>${team().map(e=>{const d=draft.entries.find(x=>x.employeeId===e.id);return `<tr><td><div class="row"><span class="avatar">${esc(e.firstName[0]+e.lastName[0])}</span><div><strong>${esc(e.firstName+' '+e.lastName)}</strong><br><small>${esc(e.jobTitle)} · ${money(e.payType.hourlyRate)}/h</small></div></div></td>${['regularHours','overtimeHours','cashTipsCents','paycheckTipsCents','serviceChargesCents'].map(key=>`<td><input type="number" aria-label="${esc(e.firstName+' '+key)}" data-entry="${e.id}" data-key="${key}" min="0" max="${key.endsWith('Cents')?'1000000':'744'}" step="0.01" value="${key.endsWith('Cents')?(d[key]/100).toFixed(2):d[key]}"></td>`).join('')}<td><label class="checklabel"><input type="checkbox" data-reviewed="${e.id}" ${d.hoursReviewed&&d.tipsReviewed?'checked':''}><span>Hours<br>& tips</span></label></td></tr>`}).join('')}</tbody></table></div><div style="padding:18px 24px;background:#fafbf7;border-top:1px solid var(--line)"><span class="hint">Confirm weekly overtime and job rates against your time records. Review zero-tip entries too.</span></div></div><div class="alert" style="margin-top:18px">Tipped wages and service charges need specialist processing in this release. You can save and review them here; approval stays blocked so they are never silently omitted.</div><div id="payerror" style="margin-top:18px" role="alert"></div><div class="foot"><span class="hint">Calculating a draft does not change payroll history.</span><button class="btn primary" data-action="calculate">Review payroll →</button></div>`}
function reviewPage(){if(!review){step=0;return hoursPage()}return `<div class="reviewlayout"><div class="stack"><div class="card"><div class="row between"><h3>${date(draft.periodStart)} – ${date(draft.periodEnd)}</h3><button class="btn text" data-action="back">Edit hours ↗</button></div><p class="hint" style="margin-top:7px">Pay date ${date(draft.checkDate)} · ${review.run.lines.length} people</p><hr class="divider"><div class="scroll"><table><thead><tr><th>Person</th><th>Gross</th><th>Tax</th><th>Take-home</th></tr></thead><tbody>${review.run.lines.map(l=>{const e=team().find(e=>e.id===l.employeeId);return `<tr><td>${esc(e?.firstName+' '+e?.lastName)}</td><td>${money(l.grossPay)}</td><td>${money(l.employeeTaxTotal)}</td><td><strong>${money(l.netPayAfterGarnishment)}</strong></td></tr>`}).join('')}</tbody></table></div></div>${review.blockers.length?`<div class="alert"><h3 style="margin-bottom:10px">A few things need attention</h3><ul>${review.blockers.map(b=>`<li>${esc(b)}</li>`).join('')}</ul><button class="btn" data-action="back">Go back and resolve →</button></div>`:'<div class="alert success">✓ The calculation is ready for your final review.</div>'}<div class="card"><h3>Before you record this payroll</h3><p class="muted" style="font-size:13px;margin:13px 0">Approval saves the register and updates year-to-date wages. It does not send bank payments or submit tax filings.</p><label class="checklabel"><input id="ack" type="checkbox"><span>I reviewed these amounts and understand that payment and tax filing must be completed separately.</span></label></div><div id="payerror" role="alert"></div></div><aside class="card summary"><div class="tag">Your payroll summary</div><div style="font-size:36px;letter-spacing:-1px;margin:12px 0 3px">${money(review.totals.employerCost)}</div><small>Total employer cost</small><hr class="divider"><div class="metriclist">${[['Gross wages',review.totals.gross],['Employee taxes',review.totals.employeeTaxes],['Employer taxes',review.totals.employerTaxes],['Take-home pay',review.totals.net],['Reported tips',review.totals.reportedTips]].map(([k,v])=>`<div class="row"><span class="muted">${k}</span><strong>${money(v)}</strong></div>`).join('')}</div><hr class="divider"><button class="btn primary" style="width:100%" data-action="approve" ${review.blockers.length?'disabled':''}>Approve & record →</button><p class="hint" style="text-align:center;margin-top:12px">No funds will be moved.</p></aside></div>`}
function donePage(){return `<div class="card empty"><div style="font-size:40px;color:#74965c;margin-bottom:15px">✓</div><span class="pill">Register saved</span><h2 style="margin-top:20px">One less thing on your list.</h2><p>Payroll for ${date(result?.periodStart)} – ${date(result?.periodEnd)} is recorded.</p><div class="row" style="justify-content:center;margin-bottom:24px"><span class="pill amber">Payment not submitted</span><span class="pill amber">Taxes not filed</span></div><button class="btn primary" data-action="exportlast">Download payroll register ↓</button> <button class="btn" data-view="history">View history →</button><p class="hint" style="margin-top:24px">Arrange employee payments and required tax filings through your provider.</p></div>`}
function teamPage(){return title('Your people','A great team, all together.','The people who bring your restaurant to life.',`<button class="btn primary" data-action="addemployee">+ Add a person</button>`)+(team().length?`<div class="card" style="padding:0"><div class="scroll"><table><thead><tr><th>Person</th><th>Role</th><th>Department</th><th>Hourly rate</th><th>Hired</th></tr></thead><tbody>${team().map(e=>`<tr><td><div class="row"><span class="avatar">${esc(e.firstName[0]+e.lastName[0])}</span><strong>${esc(e.firstName+' '+e.lastName)}</strong></div><small>Employee ID: ${esc(e.id)}</small></td><td>${esc(e.jobTitle)}</td><td>${esc(e.department)}</td><td>${money(e.payType.hourlyRate)}</td><td>${date(e.hireDate)}</td></tr>`).join('')}</tbody></table></div></div>`:`<div class="card empty"><h2>Every great restaurant starts with people.</h2><p>Add your first team member to prepare payroll.</p><button class="btn primary" data-action="addemployee">Add a person →</button></div>`)}
function integrationPage(){return title('Connections','Your tools. Working together.','Bring labor into payroll, with a review before anything is posted.')+`<div class="integrations">${state.integrations.map(p=>`<div class="card"><div class="row between"><div class="provider">${esc(p.name)}</div><span class="pill ${p.configured?'':'gray'}">${p.configured?'Configured':p.required.length?'Needs API access':'CSV import'}</span></div><h3 style="font-size:13px">${esc(p.capability)}</h3><p class="hint" style="margin:13px 0 23px;min-height:58px">${esc(p.note)}</p><button class="btn" data-provider="${esc(p.id)}">${p.configured?'Import labor':'Set up import'} ↗</button></div>`).join('')}</div>`}
function historyPage(){return title('Payroll history','Every payday, accounted for.','Your recorded payroll registers, ready when you need them.')+(runs().length?`<div class="card" style="padding:0"><div class="scroll"><table><thead><tr><th>Pay period</th><th>Pay date</th><th>People</th><th>Gross wages</th><th>Status</th><th>Register</th></tr></thead><tbody>${runs().map(r=>`<tr><td><strong>${date(r.periodStart)} – ${date(r.periodEnd)}</strong></td><td>${esc(r.checkDate)}</td><td>${r.lines.length}</td><td>${money(r.lines.reduce((s,l)=>s+l.grossPay,0))}</td><td><span class="pill">Recorded</span><br><small>Unpaid · Unfiled</small></td><td><button class="btn" data-export="${r.id}">CSV ↓</button></td></tr>`).join('')}</tbody></table></div></div>`:`<div class="card empty"><h2>Your first payday starts here.</h2><p>Approved payroll will appear here with a downloadable register.</p><button class="btn primary" data-view="payroll">Prepare payroll →</button></div>`)}
function settingsPage(){return title('Workspace settings','The details behind payday.','Keep your employer information in order.')+`<div class="card" style="max-width:650px"><h3>${esc(company().legalName)}</h3><p class="muted" style="margin:8px 0 25px">${esc(company().homeState)} · ${esc(company().paySchedule.frequency)} payroll</p><form id="settingsform" class="stack"><label>Employer identification number (EIN)<input name="ein" placeholder="12-3456789" pattern="[0-9]{2}-[0-9]{7}" required></label><p class="hint">Use your restaurant’s assigned EIN. It is stored server-side and is required before calculation.</p><div id="formerror"></div><button class="btn primary" type="submit">Save employer details</button></form><hr class="divider"><h3>Account & services</h3><p class="hint" style="margin-top:10px">Signed in as ${esc(state.user.email)}. Sessions expire after 8 hours. Payments, tax filing, email verification and password recovery are not connected in this release.</p></div>`}
function stateOptions(selected){return 'AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY'.split(' ').map(s=>`<option ${selected===s?'selected':''}>${s}</option>`).join('')}
function modal(content){$('#overlay').innerHTML=`<div class="modalback"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modaltitle">${content}</div></div>`;$('#overlay').querySelector('input,select,button')?.focus()}
function close(){ $('#overlay').innerHTML='' }
function employeeModal(){modal(`<div class="row between"><h2 id="modaltitle">A new face on the team.</h2><button class="btn text" data-action="close" aria-label="Close">×</button></div><p>Add an hourly employee. Copy filing status from their W-4. This form currently supports a basic W-4 with no adjustments and zero opening YTD.</p><form id="employeeform" class="stack"><div class="fields"><label>First name<input name="firstName" maxlength="80" required></label><label>Last name<input name="lastName" maxlength="80" required></label><label>Role<input name="jobTitle" placeholder="Line cook" maxlength="80" required></label><label>Department<select name="department"><option>Back of house</option><option>Front of house</option></select></label><label>Hourly rate ($)<input name="rate" type="number" min="0.01" max="1000" step="0.01" required></label><label>Hire date<input name="hireDate" type="date" value="${today()}" required></label><label>Residence state<select name="residenceState">${stateOptions(company().homeState)}</select></label><label>W-4 filing status<select name="filingStatus"><option value="single">Single</option><option value="married_joint">Married filing jointly</option><option value="married_separate">Married filing separately</option><option value="head_of_household">Head of household</option></select></label><label class="full checklabel"><input type="checkbox" required><span>I confirm this employee has no prior wages this year, no W-4 adjustments, deductions or garnishments requiring setup outside this form.</span></label></div><div id="formerror" role="alert"></div><button type="submit" class="btn primary">Add to your team →</button></form>`);$('#employeeform').onsubmit=async e=>{e.preventDefault();await submit(e,async()=>{const d=Object.fromEntries(new FormData(e.target));d.rate=Math.round(Number(d.rate)*100);await api('employees',d);close();await load();toast('Your team member is added.')})}}
async function submit(e,fn){e.submitter.disabled=true;try{await fn()}catch(err){const el=$('#formerror');if(el)el.innerHTML=`<div class="alert error">${esc(err.message)}</div>`;else toast(err.message)}finally{if(e.submitter.isConnected)e.submitter.disabled=false}}
function bindView(){document.querySelectorAll('[data-date]').forEach(el=>el.onchange=()=>{draft[el.dataset.date]=el.value;saveDraft()});document.querySelectorAll('[data-entry]').forEach(el=>el.oninput=()=>{const e=draft.entries.find(e=>e.employeeId===el.dataset.entry),k=el.dataset.key;e[k]=k.endsWith('Cents')?Math.round(Number(el.value)*100):Number(el.value);e.hoursReviewed=false;e.tipsReviewed=false;const check=document.querySelector(`[data-reviewed="${e.employeeId}"]`);if(check)check.checked=false;saveDraft()});document.querySelectorAll('[data-reviewed]').forEach(el=>el.onchange=()=>{const e=draft.entries.find(e=>e.employeeId===el.dataset.reviewed);e.hoursReviewed=el.checked;e.tipsReviewed=el.checked;saveDraft()});if($('#settingsform'))$('#settingsform').onsubmit=async e=>{e.preventDefault();await submit(e,async()=>{await api('settings',Object.fromEntries(new FormData(e.target)));toast('Employer details saved.')})}}
function download(name,text,type='text/csv'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csvCell(v){let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
function exportRun(r){if(!r)return;const rows=[['Pay date','Period start','Period end','Employee','Gross','Employee taxes','Employer taxes','Garnishments','Take-home','Payment status','Filing status'],...r.lines.map(l=>{const e=team().find(e=>e.id===l.employeeId);return[r.checkDate,r.periodStart,r.periodEnd,e?e.firstName+' '+e.lastName:l.employeeId,(l.grossPay/100).toFixed(2),(l.employeeTaxTotal/100).toFixed(2),(l.employerTaxTotal/100).toFixed(2),(l.garnishmentTotal/100).toFixed(2),(l.netPayAfterGarnishment/100).toFixed(2),'not submitted','not filed']})];download(`payroll-${r.checkDate}.csv`,rows.map(r=>r.map(csvCell).join(',')).join('\r\n'))}
function template(){download('restaurant-hours-template.csv','employeeId,regularHours,overtimeHours,cashTips,paycheckTips,serviceCharges\r\n'+team().map(e=>[e.id,0,0,0,0,0].join(',')).join('\r\n'))}
function parseCsv(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw new Error('CSV contains an unclosed quote.');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function importModal(provider){const p=state.integrations.find(p=>p.id===provider);modal(`<div class="row between"><h2 id="modaltitle">Bring your hours together.</h2><button class="btn text" data-action="close" aria-label="Close">×</button></div><p>Import a CSV using employee IDs from Your people, or request labor from a configured POS. Imports replace the matching rows in this draft and need your review.</p><div class="stack"><label>CSV file<input type="file" id="csvfile" accept=".csv,text/csv"></label><button class="btn" data-action="template">Download CSV template ↓</button><hr class="divider"><label>POS provider<select id="posprovider">${state.integrations.filter(p=>p.required.length).map(x=>`<option value="${x.id}" ${p?.id===x.id?'selected':''}>${x.name}${x.configured?'':' · API access required'}</option>`).join('')}</select></label><div class="alert">${esc(p?.note||'Your administrator must configure API access for your restaurant. Credentials are never entered in the browser.')}</div><button class="btn primary" data-action="posfetch">Fetch labor for this pay period →</button><div id="importerror" role="alert"></div><div id="importresult"></div></div>`);$('#csvfile').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>1000000)throw new Error('Use a CSV smaller than 1 MB.');const rows=parseCsv(await file.text());const header=rows.shift()?.map(x=>x.trim().replace(/^\uFEFF/,''));const required=['employeeId','regularHours','overtimeHours','cashTips','paycheckTips','serviceCharges'];if(required.some(k=>!header.includes(k)))throw new Error('Use the supplied template with all six columns.');const seen=new Set(),entries=rows.map(row=>{const d=Object.fromEntries(header.map((h,i)=>[h,row[i]?.trim()]));if(!team().some(e=>e.id===d.employeeId)||seen.has(d.employeeId))throw new Error('CSV has an unknown or repeated employee ID. Nothing was imported.');seen.add(d.employeeId);const output={employeeId:d.employeeId,hoursReviewed:false,tipsReviewed:false};for(const k of required.slice(1)){if(d[k]===''||d[k]===undefined||!Number.isFinite(Number(d[k]))||Number(d[k])<0)throw new Error('CSV contains an invalid amount. Nothing was imported.');output[k.endsWith('Hours')?k:k+'Cents']=k.endsWith('Hours')?Number(d[k]):Math.round(Number(d[k])*100)}return output});if(!entries.length)throw new Error('This CSV is empty.');draft.entries=draft.entries.map(e=>entries.find(x=>x.employeeId===e.employeeId)||e);saveDraft();close();view='payroll';step=0;render();toast(`${entries.length} employee rows imported. Review hours and tips.`)}catch(err){$('#importerror').innerHTML=`<div class="alert error">${esc(err.message)}</div>`}}}
async function posFetch(button){button.disabled=true;try{const data=await api('pos/import',{provider:$('#posprovider').value,start:draft.periodStart+'T00:00:00Z',end:addDays(draft.periodEnd,1)+'T00:00:00Z'});const groups=Object.groupBy(data.rows,r=>r.workerId);window.pendingPos=groups;$('#importresult').innerHTML=`<div class="alert">${data.warnings.map(esc).join('<br>')}<br>Requested boundaries use UTC. Verify them against the restaurant’s local pay period.</div><div class="stack" style="margin-top:18px">${Object.entries(groups).map(([id,rows],i)=>`<label>POS worker ${esc(id)} · ${rows.reduce((s,r)=>s+r.paidHours,0).toFixed(2)} h<select data-map="${i}"><option value="">Select your employee</option>${team().map(e=>`<option value="${e.id}">${esc(e.firstName+' '+e.lastName)}</option>`).join('')}</select></label>`).join('')}<label class="checklabel"><input type="checkbox" id="timezoneack"><span>I verified that these imported shifts match the local pay period.</span></label><button class="btn primary" data-action="applypos" ${!data.rows.length?'disabled':''}>Apply matched hours →</button></div>`}catch(err){$('#importerror').innerHTML=`<div class="alert error">${esc(err.message)}</div>`}finally{button.disabled=false}}
function applyPos(){try{if(!$('#timezoneack')?.checked)throw new Error('Verify the local pay period before applying imported hours.');const groups=Object.values(window.pendingPos),seen=new Set(),updates=[];document.querySelectorAll('[data-map]').forEach(sel=>{if(!sel.value)throw new Error('Match every POS employee before applying.');if(seen.has(sel.value))throw new Error('Each employee can only be matched once.');seen.add(sel.value);const rows=groups[Number(sel.dataset.map)];if(rows.some(r=>!r.end))throw new Error('Close all open shifts before importing.');const employee=team().find(e=>e.id===sel.value);if(rows.some(r=>r.hourlyRateCents!=null&&r.hourlyRateCents!==employee.payType.hourlyRate))throw new Error('An imported job rate differs from the employee rate. Reconcile multiple job rates before payroll.');updates.push({id:sel.value,regularHours:rows.reduce((s,r)=>s+(r.regularHours??r.paidHours),0),overtimeHours:rows.reduce((s,r)=>s+(r.overtimeHours??0),0)})});for(const u of updates){const e=draft.entries.find(e=>e.employeeId===u.id);e.regularHours=u.regularHours;e.overtimeHours=u.overtimeHours;e.hoursReviewed=false;e.tipsReviewed=false}saveDraft();close();step=0;view='payroll';render();toast('Hours imported. Reconcile weekly overtime and tips before review.')}catch(e){$('#importerror').innerHTML=`<div class="alert error">${esc(e.message)}</div>`}}
document.addEventListener('click',async e=>{const el=e.target.closest('button');if(!el)return;try{if(el.dataset.view){view=el.dataset.view;if(view==='payroll'&&step===2){step=0;review=null}render();return}if(el.dataset.provider){importModal(el.dataset.provider);return}if(el.dataset.export){exportRun(runs().find(r=>r.id===el.dataset.export));return}const action=el.dataset.action;if(!action)return;if(action==='signup'||action==='login'){authPage(action==='signup');return}if(action==='close'){close();return}if(action==='logout'){await api('auth/logout',{});state=null;draft={entries:[]};review=null;landing();return}if(action==='addemployee'){employeeModal();return}if(action==='template'){template();return}if(action==='import'){importModal();return}if(action==='posfetch'){await posFetch(el);return}if(action==='applypos'){applyPos();return}if(action==='back'){step=0;render();return}if(action==='exportlast'){exportRun(result);return}if(action==='calculate'){el.disabled=true;try{clearTimeout(saveTimer);await api('draft',draft);review=await api('review',{...draft,companyId:company().id});step=1;render();window.scrollTo(0,0)}catch(err){$('#payerror').innerHTML=`<div class="alert error">${esc(err.message)}</div>`}finally{if(el.isConnected)el.disabled=false}return}if(action==='approve'){if(!$('#ack').checked){toast('Confirm the final review before recording payroll.');return}el.disabled=true;try{const data=await api('approve',{reviewId:review.run.id,acknowledged:true});result=data.run;state=await api('workspace');step=2;draft={periodStart:addDays(result.periodEnd,1),entries:[]};ensureDraft();await api('draft',draft);render()}catch(err){$('#payerror').innerHTML=`<div class="alert error">${esc(err.message)}</div>`}finally{if(el.isConnected)el.disabled=false}}}catch(err){toast(err.message)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&$('#overlay .modal')){const nodes=[...$('#overlay .modal').querySelectorAll('button,input,select,a[href]')].filter(n=>!n.disabled);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
(async()=>{if(location.pathname==='/login'||location.pathname==='/signup'){authPage(location.pathname==='/signup');return}if(location.pathname==='/app'){try{await load()}catch{authPage(false)}return}landing()})();
</script></body></html>
