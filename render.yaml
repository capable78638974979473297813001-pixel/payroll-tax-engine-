# Render Blueprint: https://render.com/docs/blueprint-spec
# One web service, one persistent disk. Keep numInstances at 1: the account
# store is a file on that disk.
services:
  - type: web
    name: omnia
    runtime: docker
    plan: starter
    region: oregon
    numInstances: 1
    healthCheckPath: /healthz
    autoDeploy: true
    domains:
      - omniatax.io
      - www.omniatax.io
    disk:
      name: omnia-data
      mountPath: /var/data
      # The address index lives here too: measured at 13.8 GB for 206M points,
      # plus the largest regional zip (2.7 GB) while it builds. A Render disk can
      # be grown but never shrunk.
      sizeGB: 30
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://omniatax.io
      - key: TRUST_PROXY
        value: "1"
      # Search Console HTML-tag token (content value only). Set in the dashboard.
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      # Secrets: set these in the Render dashboard (sync: false keeps them out of git).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_METER_EVENT_NAME
        sync: false
      # The large address index behind keyed geocoding. With neither line below
      # set the site still works, on the live address services only. Preferred:
      # ADDRESS_INDEX_URL (a prebuilt address-points.db or .db.gz, minutes to fetch).
      # Otherwise AUTOBUILD builds it here from OpenAddresses, which takes hours
      # on this instance size, at the lowest CPU priority.
      - key: ADDRESS_INDEX_AUTOBUILD
        value: "1"
      - key: ADDRESS_INDEX_URL
        sync: false
      - key: ADDRESS_INDEX_SHA256
        sync: false
      # Fallback name if STRIPE_METER_EVENT_NAME is unset. Set in the dashboard; do not commit it.
      - key: STRIPE_METER_EVENT
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Encrypts the Stripe account backup. Set it to a long random string BEFORE ever rotating
      # STRIPE_SECRET_KEY: without it the backup key is derived from the Stripe key, and a rotation
      # makes every existing backup unreadable.
      - key: STORE_MIRROR_SECRET
        sync: false
      # Bearer token that unlocks the detailed /healthz view (data path, backup counts, integrations).
      # Without it only loopback callers see the detail; the public body is liveness only.
      - key: HEALTH_TOKEN
        sync: false
      # Where contact-form messages go. Set it; the code's fallback is a personal mailbox.
      - key: CONTACT_TO
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "Omnia.tax <verify@omniatax.io>"
      # The Python email verifier starts by itself once RESEND_API_KEY (or SMTP_HOST)
      # is set, and keeps its own secrets on the disk. Set VERIFIER_SECRET and
      # VERIFIER_PEPPER (32+ chars each) only if you want to choose them.
      # Leave unset while testing (sk_test_ Stripe keys). Set to 1 before using sk_live_.
      # - key: STRIPE_ALLOW_LIVE
      #   value: "1"
      # Customer API keys are always sk_live_. OMNIA_ISSUE_LIVE_KEYS is not read.
