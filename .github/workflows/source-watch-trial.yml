name: Source watch baseline (temporary)

# Temporary: rebuilds the watcher's baseline on GitHub's runners with the
# final code, checks a second pass is quiet, and commits the baseline to this
# branch. Delete after use.
on:
  push:
    branches: ['claude/intelligent-tesla-q5vtjv']
    paths: ['watcher/**', '.github/workflows/source-watch-trial.yml']

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          pip install -r watcher/requirements.txt
          python -m playwright install --with-deps chromium
      - run: python -m unittest watcher/test_watch.py
      - name: Fresh baseline
        run: |
          rm -rf watcher/state watcher/reports
          python watcher/watch.py > /dev/null
      - name: Second pass (should be quiet)
        run: |
          rm -f watcher/reports/*-*.md
          python watcher/watch.py | head -40
      - name: Commit baseline to this branch
        run: |
          git config user.name "source-watch[bot]"
          git config user.email "source-watch[bot]@users.noreply.github.com"
          git add watcher/
          git commit -m "source watch: baseline taken on GitHub's runners [skip ci]" && git push origin HEAD:${GITHUB_REF_NAME}
