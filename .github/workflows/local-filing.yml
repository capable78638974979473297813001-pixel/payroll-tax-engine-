name: Local employer filing guides
on:
  pull_request:
    paths:
      - 'payroll/local/**'
      - 'data/filing/local/**'
      - 'data/local/**'
      - 'tests/local-filing-guide.test.mjs'
      - '.github/workflows/local-filing.yml'
permissions:
  contents: read
jobs:
  filing-guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/local-filing-guide.test.mjs
