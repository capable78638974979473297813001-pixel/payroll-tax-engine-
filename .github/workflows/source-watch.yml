name: Source watch

# Checks every official source in watcher/sources.json at 4 AM US Eastern and
# commits a report of what changed to watcher/reports/. Opens an issue when
# something changed.
#
# GitHub cron runs in UTC and has no time zones: 08:00 UTC is 4 AM during
# daylight time (EDT) and 09:00 UTC is 4 AM during standard time (EST). GitHub
# also starts scheduled jobs late when it's busy (hours, sometimes) and can
# drop one outright, so later triggers back those up. The gate step runs the
# watch at the first trigger at or after 4 AM local time that finds no report
# for today yet, and every later trigger that day skips.
on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 11 * * *'
    - cron: '0 13 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: source-watch
  cancel-in-progress: false

env:
  WATCH_TZ: America/New_York

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Is it 4 AM yet, and not already done today?
        id: gate
        run: |
          today=$(TZ="$WATCH_TZ" date +%F)
          hour=$(TZ="$WATCH_TZ" date +%-H)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$hour" -lt 4 ] || [ -f "watcher/reports/$today.md" ]; then
            echo "Local time is ${hour}h in $WATCH_TZ, or today's report exists; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: watcher/requirements.txt

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -r watcher/requirements.txt
          # Headless Chromium for sites that refuse plain requests or need JavaScript.
          python -m playwright install --with-deps chromium

      - name: Self-test (offline)
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest watcher/test_watch.py watcher/test_autoupdate.py watcher/test_coverage.py watcher/test_zero_day.py

      - name: Refresh the source list from data/
        if: steps.gate.outputs.run == 'true'
        run: python watcher/build_sources.py

      - name: Watch
        if: steps.gate.outputs.run == 'true'
        id: watch
        env:
          # Free keys for official APIs; sources that need a missing key are
          # listed in the report rather than failing the run.
          NYSENATE_API_KEY: ${{ secrets.NYSENATE_API_KEY }}
        run: |
          python watcher/watch.py > /dev/null
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s = json.load(open("watcher/reports/latest.json"))
          print(f"changed={s['significant_changes']}")
          print(f"unverified={s.get('unverified', 0)}")
          print(f"never={len(s.get('never_baselined', []))}")
          print(f"broken={len(s.get('broken', []))}")
          print(f"attention={len(s.get('attention', []))}")
          print(f"total={s['total']}")
          PY

      # A successful run is not a full check. Surface how many sources were
      # NOT read, as annotations on the run, so green never reads as "every
      # source verified".
      - name: Flag sources that were not checked
        if: steps.gate.outputs.run == 'true' && steps.watch.outputs.unverified != '0'
        run: |
          echo "::warning title=Sources not checked::${{ steps.watch.outputs.unverified }} of ${{ steps.watch.outputs.total }} sources could not be read this run (${{ steps.watch.outputs.broken }} broken for 3+ runs, ${{ steps.watch.outputs.never }} never read). See watcher/reports/latest.md."

      - name: Commit report and snapshots
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "source-watch[bot]"
          git config user.email "source-watch[bot]@users.noreply.github.com"
          git add watcher/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "source watch: ${{ steps.gate.outputs.today }} (${{ steps.watch.outputs.changed }} changed) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "::warning::Could not push the watch report."

      # Zero-day problems (watcher/zero_day.py, watcher/README.md). A zero-day
      # problem is an official change to a number the engine uses for a
      # paycheck. watcher/autoupdate.py re-reads the official files twice, applies
      # every rule, runs the full test suite and makes ONE commit holding only the
      # fixed data lines, the regenerated bundle and the run report. That commit is
      # checked against its own report (--guard) and pushed straight to the base
      # branch. Anything else (headings, news, rewording, links) changes no file.
      # Emergency stop: set the repository variable AUTOUPDATE_PAUSED to 'true'.
      - name: Set up Node (the fix is verified with the real test suite)
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Fix zero-day problems on main
        id: zeroday
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          AUTOUPDATE_PAUSED: ${{ vars.AUTOUPDATE_PAUSED }}
        run: |
          git config user.name "source-watch[bot]"
          git config user.email "source-watch[bot]@users.noreply.github.com"
          base="${GITHUB_REF_NAME}"
          today="${{ steps.gate.outputs.today }}"
          git pull --rebase --autostash origin "$base"
          start=$(git rev-parse HEAD)
          python watcher/autoupdate.py --apply --commit
          if [ "$(git rev-parse HEAD)" != "$start" ]; then
            if ! python watcher/autoupdate.py --guard HEAD; then
              echo "::error::The zero-day commit touched files it did not fix; discarding it."
              git reset --hard "$start"
              exit 1
            fi
            pushed=""
            for i in 1 2 3 4; do
              if git pull --rebase origin "$base" && git push origin "HEAD:$base"; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            if [ -z "$pushed" ]; then
              echo "::error::Could not push the zero-day fix; discarding it. The next run retries."
              git reset --hard "$start"
              exit 1
            fi
            echo "fixed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          git add watcher/reports/autoupdate-latest.* watcher/autoupdate-log.jsonl 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "auto-update report: $today [skip ci]"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "$base" && git push origin "HEAD:$base" && break
              sleep $((i * 5))
            done
          fi

      - name: Zero-day report
        id: zdreport
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FIXED_SHA: ${{ steps.zeroday.outputs.fixed_sha }}
        run: |
          python watcher/zero_day.py > /dev/null
          read fixed verified possible <<<"$(python - <<'PY'
          import json
          z = json.load(open("watcher/reports/zero-day-latest.json"))
          print(len(z["fixed"]), len(z["verified"]), len(z["possible"]))
          PY
          )"
          git config user.name "source-watch[bot]"
          git config user.email "source-watch[bot]@users.noreply.github.com"
          git add watcher/reports/zero-day-latest.*
          if ! git diff --cached --quiet; then
            git commit -m "zero-day report: ${{ steps.gate.outputs.today }} [skip ci]"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i * 5))
            done
          fi
          if [ "$fixed" != "0" ] || [ "$verified" != "0" ] || [ "$possible" != "0" ]; then
            gh label create zero-day --color D93F0B --description "A change that affects a paycheck" 2>/dev/null || true
            body=$(cat watcher/reports/zero-day-latest.md)
            if [ -n "$FIXED_SHA" ]; then body="$body

          Commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${FIXED_SHA}"; fi
            gh issue create --label zero-day \
              --title "Zero-day (${{ steps.gate.outputs.today }}): $fixed fixed, $((verified + possible)) need a person" \
              --body "$body" || echo "::warning::Could not open the zero-day issue."
          fi

      # What auto-update declined or only compared: the data disagrees with an
      # official statement, or a proposed change broke a rule. One standing
      # issue, rewritten on each run while anything is listed.
      - name: Track what auto-update left for a person
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f watcher/reports/autoupdate-latest.json ] || exit 0
          count=$(python - <<'PY'
          import json
          s = json.load(open("watcher/reports/autoupdate-latest.json"))
          print(len(s.get("left_for_a_person", [])) + len(s.get("disagreements_for_a_person", [])))
          PY
          )
          [ "$count" != "0" ] || exit 0
          title="Source watch: auto-update left items for a person"
          body=$(python - <<'PY'
          import json
          s = json.load(open("watcher/reports/autoupdate-latest.json"))
          lines = [f"As of {s['date']}, auto-update did not change these. Each is either a disagreement between the data and an official statement that needs a person, or a proposed change that broke one of its rules (the reason is listed). Rewritten on each run; close it once handled.", ""]
          for r in s.get("left_for_a_person", []):
              p = r["proposal"]
              lines.append(f"- `{p.get('file', '?')}` ({p.get('name', '')}): {r['reason']}")
          for d in s.get("disagreements_for_a_person", []):
              lines.append(f"- {d['jurisdiction']} {d['name']}: {d['detail']}")
          lines += ["", "Full report: watcher/reports/autoupdate-latest.md"]
          print("\n".join(lines))
          PY
          )
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body" || echo "::warning::Could not update the auto-update issue."
          else
            gh issue create --title "$title" --body "$body" || echo "::warning::Could not open the auto-update issue."
          fi

      # One standing issue, not one a day: opened while sources have never
      # been read or are broken, left alone while it is already open.
      - name: Track sources that are not being watched
        if: steps.gate.outputs.run == 'true' && (steps.watch.outputs.never != '0' || steps.watch.outputs.broken != '0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Source watch: official sources that are not being checked"
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then
            echo "Tracking issue already open."
            exit 0
          fi
          body=$(python - <<'PY'
          import json
          s = json.load(open("watcher/reports/latest.json"))
          lines = [f"As of {s['date']}, {s.get('unverified', 0)} of {s['total']} sources could not be read. "
                   "The daily run still succeeds, so this issue is the standing reminder.", ""]
          if s.get("never_baselined"):
              lines += ["**Never read successfully** (no baseline, so changes go unnoticed):", ""]
              lines += [f"- {u}" for u in s["never_baselined"][:80]] + [""]
          if s.get("broken"):
              lines += ["**Broken for 3+ runs:**", ""] + [f"- {u}" for u in s["broken"][:80]]
          print("\n".join(lines))
          PY
          )
          gh issue create --title "$title" --body "$body" || echo "::warning::Could not open the tracking issue."

      # One standing issue that always shows what needs a person today: an
      # official rate file that can't be read, or engine data that disagrees
      # with one. Opened when something needs attention, rewritten on each run
      # while it still does, and left for a person to close once it is fixed.
      - name: Track items that need attention
        if: steps.gate.outputs.run == 'true' && steps.watch.outputs.attention != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Source watch: needs attention (official file unreadable or data disagrees)"
          body=$(python - <<'PY'
          import json
          s = json.load(open("watcher/reports/latest.json"))
          lines = [f"As of {s['date']}, {len(s['attention'])} item(s) need a person. A run with no changes is not an "
                   "all-clear while this issue lists anything. Rewritten on each run; close it once fixed.", ""]
          for a in s["attention"]:
              name = f"[{a['title']}]({a['url']})" if a.get("url") else a["title"]
              lines.append(f"- **{name}**: {a['detail']}")
          lines += ["", "Full report: watcher/reports/latest.md"]
          print("\n".join(lines))
          PY
          )
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body" || echo "::warning::Could not update the attention issue."
          else
            gh issue create --title "$title" --body "$body" || echo "::warning::Could not open the attention issue."
          fi

      - name: Open an issue for changes
        if: steps.gate.outputs.run == 'true' && steps.watch.outputs.changed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(head -c 60000 watcher/reports/latest.md)
          if [ "$(wc -c < watcher/reports/latest.md)" -gt 60000 ]; then
            body="$body

          ... report truncated; full version in watcher/reports/${{ steps.gate.outputs.today }}.md"
          fi
          gh issue create \
            --title "Official sources changed (informational): ${{ steps.gate.outputs.today }} (${{ steps.watch.outputs.changed }})" \
            --body "$body" || echo "::warning::Could not open an issue."
