name: Harvest daily

# GitHub cron is UTC. Run every day just after 04:00 UTC to reduce scheduler
# contention at the top of the hour. Use workflow_dispatch for an immediate run.
on:
  schedule:
    - cron: '7 4 * * *'
  workflow_dispatch: {}

concurrency:
  group: harvest-daily
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  STATE_BRANCH: harvester-state
  FINDINGS_LABEL: harvester-findings

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install PDF text extraction
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Ensure tracking labels exist
        run: |
          gh label create "$FINDINGS_LABEL" --color FBCA04 \
            --description "Open harvester findings awaiting review" 2>/dev/null || true
          gh label create harvester-broken --color B60205 \
            --description "The harvest monitor itself failed" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      # Snapshots and the journal must survive the ephemeral Actions runner.
      # Keep them on a dedicated branch rather than in the application branch.
      - name: Restore harvester state
        run: |
          set -e
          mkdir -p harvester/state harvester/snapshots
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
            git clone --branch "$STATE_BRANCH" --single-branch --depth 1 \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state-branch
            [ -d state-branch/harvester/state ] && cp -a state-branch/harvester/state/. harvester/state/ || true
            [ -d state-branch/harvester/snapshots ] && cp -a state-branch/harvester/snapshots/. harvester/snapshots/ || true
          else
            mkdir -p state-branch
            git -C state-branch init -q
            git -C state-branch checkout -q --orphan "$STATE_BRANCH"
          fi

      - name: Run the daily sweep
        id: harvest
        run: npm run harvest:daily

      # Run even after a failed sweep so partial journal/state updates are not lost.
      - name: Commit harvester state
        if: always()
        run: |
          set -e
          mkdir -p state-branch/harvester/state state-branch/harvester/snapshots
          cp -a harvester/state/. state-branch/harvester/state/ 2>/dev/null || true
          if [ -d harvester/snapshots ]; then
            (cd harvester/snapshots && find . -name '*.meta.json' \
              -exec cp --parents {} ../../state-branch/harvester/snapshots/ \;)
          fi
          cd state-branch
          git config user.name "harvester-bot"
          git config user.email "harvester-bot@users.noreply.github.com"
          git add harvester/state harvester/snapshots
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -q -m "Harvest state: run ${{ github.run_id }} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:"$STATE_BRANCH"
          fi

      - name: Reflect findings and health in one issue
        if: always()
        run: |
          set -e
          HEALTH=$(node examples/harvest-daily.ts status --json) || true
          printf '%s' "$HEALTH" > health.json
          OPEN_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('health.json','utf8')).openFindings.length)")
          HEALTH_STATUS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('health.json','utf8')).status)")
          STATUS_TEXT=$(node examples/harvest-daily.ts status) || true
          EXISTING=$(gh issue list --label "$FINDINGS_LABEL" --state open --json number --jq '.[0].number' || true)
          if [ "$OPEN_COUNT" -gt 0 ] || [ "$HEALTH_STATUS" != "green" ]; then
            BODY_FILE=$(mktemp)
            {
              echo "Automated update from the 04:00 UTC harvest, run ${{ github.run_id }}."
              echo
              echo '```'
              echo "$STATUS_TEXT"
              echo '```'
            } > "$BODY_FILE"
            TITLE="Harvester: $OPEN_COUNT open finding(s)"
            [ "$HEALTH_STATUS" = "green" ] || TITLE="$TITLE — status $HEALTH_STATUS, sources unverified"
            if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
              gh issue edit "$EXISTING" --body-file "$BODY_FILE" --title "$TITLE"
            else
              gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label "$FINDINGS_LABEL"
            fi
          elif [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "All findings acknowledged and sources are healthy as of run ${{ github.run_id }}. Closing."
            gh issue close "$EXISTING"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Flag a broken monitor
        if: failure()
        run: |
          set -e
          EXISTING=$(gh issue list --label harvester-broken --state open --json number --jq '.[0].number' || true)
          BODY="The daily harvest workflow run ${{ github.run_id }} failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "Harvester monitor is broken" --body "$BODY" --label harvester-broken
          fi
        env:
          GH_TOKEN: ${{ github.token }}
