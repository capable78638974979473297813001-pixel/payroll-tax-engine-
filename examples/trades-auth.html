<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Crewtally · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesque:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:#F4EEE1; --paper2:#EFE7D6; --card:#FFFDF7;
    --ink:#211D17; --ink2:#5b5346; --ink3:#8a8172;
    --line:#E2D9C4; --line2:#D6CBB0;
    --clay:#BE4A28; --clay-d:#9c3a1e;
    --pine:#2F5B48; --pine-s:#E3EEE4;
    --brick:#A22E1D; --brick-s:#F6E2DC;
    --sky:#33556e; --sky-s:#eaf0f4;
    --disp:"Fraunces",Georgia,serif; --body:"Hanken Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; color:var(--ink); font-family:var(--body); font-size:16.5px; line-height:1.5;
    background-color:var(--paper);
    background-image:linear-gradient(rgba(51,85,110,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(51,85,110,.05) 1px,transparent 1px);
    background-size:26px 26px; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center; padding:26px 18px calc(26px + env(safe-area-inset-bottom));
  }
  h1,h2 { font-family:var(--disp); font-weight:600; margin:0; letter-spacing:-.01em; }
  a { color:var(--sky); }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); margin:8px 0 22px; }
  .mark { width:40px; height:40px; }
  .word { font-family:var(--disp); font-weight:700; font-size:27px; letter-spacing:-.02em; }
  .word b { color:var(--clay); }

  .card { width:100%; max-width:410px; background:var(--card); border:2px solid var(--ink); border-radius:16px; box-shadow:5px 6px 0 rgba(33,29,23,.11); padding:24px; }
  .segs { display:flex; gap:6px; background:var(--paper2); border:2px solid var(--ink); border-radius:12px; padding:5px; margin-bottom:20px; }
  .seg { flex:1; text-align:center; font-family:var(--disp); font-weight:600; font-size:15.5px; padding:9px; border-radius:8px; cursor:pointer; color:var(--ink2); border:none; background:none; }
  .seg.on { background:var(--card); color:var(--ink); box-shadow:2px 2px 0 var(--ink); }

  h2.title { font-size:23px; margin-bottom:3px; }
  .lede { color:var(--ink2); font-size:14px; margin:0 0 18px; }
  label { display:block; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); margin:14px 0 5px; }
  input { font:inherit; width:100%; padding:12px; color:var(--ink); background:var(--paper); border:2px solid var(--line2); border-radius:10px; }
  input:focus { outline:none; border-color:var(--clay); background:#fff; box-shadow:0 0 0 3px rgba(190,74,40,.13); }

  .btn { font-family:var(--body); font-weight:700; cursor:pointer; color:#fff; background:var(--clay); border:2px solid var(--ink); border-radius:11px; padding:14px; box-shadow:3px 3px 0 var(--ink); transition:transform .07s, box-shadow .07s, background .12s; width:100%; font-size:16.5px; margin-top:20px; }
  .btn:hover { background:var(--clay-d); } .btn:active { transform:translate(3px,3px); box-shadow:0 0 0 var(--ink); }
  .btn:disabled { opacity:.6; }
  .btn.ghost { background:var(--card); color:var(--ink); } .btn.ghost:hover { background:var(--paper2); }
  .spin { width:16px; height:16px; border:2.5px solid currentColor; border-top-color:transparent; border-radius:50%; display:inline-block; vertical-align:-3px; animation:sp .7s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .err { color:var(--brick); background:var(--brick-s); border:1.5px solid var(--brick); border-radius:9px; padding:11px 13px; margin-top:16px; font-weight:600; font-size:14.5px; }

  .demo { width:100%; max-width:410px; margin-top:16px; text-align:center; }
  .demo .hair { display:flex; align-items:center; gap:12px; color:var(--ink3); font-size:13px; margin:2px 0 14px; }
  .demo .hair::before, .demo .hair::after { content:""; flex:1; height:2px; background:var(--line2); }
  .creds { background:var(--sky-s); border:1.5px solid var(--sky); border-radius:10px; padding:11px 13px; font-size:13.5px; color:var(--ink2); margin-top:14px; text-align:left; }
  .creds b { color:var(--ink); }
  .creds code { font-family:var(--body); background:#fff; border:1px solid var(--line2); border-radius:5px; padding:1px 6px; font-weight:700; }
  .back { margin-top:20px; font-size:14px; }
</style>
</head>
<body>
  <a class="brand" href="/">
    <svg class="mark" viewBox="0 0 44 44" fill="none" aria-hidden="true">
      <rect x="2" y="2" width="40" height="40" rx="11" fill="#211D17"/>
      <path d="M11 24.5l6.5 6.5L33 14" stroke="#BE4A28" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="33" cy="14" r="2.4" fill="#F4EEE1"/>
    </svg>
    <span class="word">Crew<b>tally</b></span>
  </a>

  <div class="card">
    <div class="segs">
      <button class="seg" id="segLogin" data-mode="login">Sign in</button>
      <button class="seg" id="segSignup" data-mode="signup">Create shop</button>
    </div>

    <!-- sign in -->
    <form id="loginForm">
      <h2 class="title">Welcome back</h2>
      <p class="lede">Sign in to your shop or your crew account.</p>
      <label>Email</label><input id="liEmail" type="email" autocomplete="username" placeholder="you@yourshop.com" />
      <label>Password</label><input id="liPass" type="password" autocomplete="current-password" placeholder="••••••••" />
      <button class="btn" id="liBtn" type="submit">Sign in</button>
      <div id="liErr"></div>
    </form>

    <!-- create shop -->
    <form id="signupForm" style="display:none">
      <h2 class="title">Start your shop</h2>
      <p class="lede">Create an owner account — you'll add your crew next. No card required.</p>
      <label>Shop name</label><input id="suShop" placeholder="Rivera Plumbing" />
      <label>Your name</label><input id="suName" placeholder="Dana Rivera" />
      <label>Email</label><input id="suEmail" type="email" autocomplete="username" placeholder="you@yourshop.com" />
      <label>Password</label><input id="suPass" type="password" autocomplete="new-password" placeholder="at least 4 characters" />
      <button class="btn" id="suBtn" type="submit">Create my shop</button>
      <div id="suErr"></div>
    </form>
  </div>

  <div class="demo">
    <div class="hair" style="margin-top:18px">or</div>
    <button class="btn ghost" id="demoBtn" style="margin-top:0">See the live demo →</button>
    <div class="creds">
      <b>Demo logins</b> (password <code>demo</code>):<br>
      Owner — <code>owner@rooterbros.test</code><br>
      Crew — <code>joe@rooterbros.test</code>
    </div>
    <div class="back"><a href="/">← Back to home</a></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  let mode = location.pathname === "/signup" ? "signup" : (params.get("mode") || "login");

  function setMode(m) {
    mode = m;
    $("segLogin").classList.toggle("on", m === "login");
    $("segSignup").classList.toggle("on", m === "signup");
    $("loginForm").style.display = m === "login" ? "" : "none";
    $("signupForm").style.display = m === "signup" ? "" : "none";
  }
  $("segLogin").addEventListener("click", () => setMode("login"));
  $("segSignup").addEventListener("click", () => setMode("signup"));
  setMode(mode);

  async function post(path, body) {
    const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    return data;
  }
  const showErr = (where, msg) => { $(where).innerHTML = `<div class="err">${msg.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))}</div>`; };
  // Where to land once signed in: owners run the shop, crew get their app.
  const landing = (account) => (account.role === "worker" ? "/me" : "/owner");

  async function withBusy(btn, label, fn) {
    const original = btn.textContent;
    btn.disabled = true; btn.innerHTML = `<span class="spin"></span> ${label}`;
    try { await fn(); } catch (e) { btn.disabled = false; btn.textContent = original; throw e; }
  }

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault(); $("liErr").innerHTML = "";
    try {
      await withBusy($("liBtn"), "Signing in…", async () => {
        const { account } = await post("/api/auth/login", { email: $("liEmail").value.trim(), password: $("liPass").value });
        location.href = landing(account);
      });
    } catch (e) { showErr("liErr", e.message); }
  });

  $("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault(); $("suErr").innerHTML = "";
    try {
      await withBusy($("suBtn"), "Creating…", async () => {
        const { account } = await post("/api/auth/signup", { shopName: $("suShop").value.trim(), name: $("suName").value.trim(), email: $("suEmail").value.trim(), password: $("suPass").value });
        location.href = landing(account);
      });
    } catch (e) { showErr("suErr", e.message); }
  });

  $("demoBtn").addEventListener("click", async () => {
    try {
      await withBusy($("demoBtn"), "Loading the sample shop…", async () => {
        await post("/api/demo/seed", {});
        location.href = "/owner";
      });
    } catch (e) { showErr("liErr", e.message); setMode("login"); }
  });
</script>
</body>
</html>
