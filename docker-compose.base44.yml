# Base44 development compose for the Omnia payroll tax engine.
# The site server runs TypeScript directly with Node 22 — no build step,
# no third-party packages to install.  Source is bind-mounted so edits
# appear live; the server is restarted to pick them up.
services:
  site:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - site-data:/var/data/site
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SITE_DB_DIR=/var/data/site
      - TRUST_PROXY=1
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-0}
    command: ["node", "site/server.ts"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  site-data:
