<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>API Console — Omnia.tax</title>
<meta name="description" content="Build a paycheck request and run it against the Omnia.tax engine." />
<link rel="icon" href="/logo/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/assets/sandbox.css" />
<!--OMNIA_CONFIG-->
<script>window.OMNIA_API_ORIGIN = "https://api.omnia.tax";</script>
</head>
<body>
<header class="top">
  <a class="logo" href="/">omnia<span>.tax</span></a>
  <span class="tsep"></span>
  <span class="tword">API Console</span>
  <div class="tr-right">
    <button type="button" class="lnk2" id="exBtn" aria-expanded="false" aria-controls="exMenu">Load example</button>
    <a class="lnk2 desk" href="/docs">API reference</a>
    <button type="button" class="key" id="keyBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="keyMenu"><span class="kd" id="keyDot"></span><span id="keyLabel">Your API key</span></button>
    <div class="exmenu" id="exMenu" hidden></div>
    <div class="keymenu" id="keyMenu" hidden>
      <div class="lab"><label for="keyInput">Your API key</label></div>
      <input id="keyInput" class="inp" autocomplete="off" spellcheck="false" placeholder="Paste your API key" />
      <div class="actions" style="margin-top:12px;padding-top:0;border-top:0">
        <button type="button" class="btn sec" id="keySave">Save</button>
        <button type="button" class="btn sec" id="keyForget">Forget</button>
      </div>
      <p>Manage this key in <a href="/dashboard">your account</a>.</p>
    </div>
  </div>
</header>
<div class="layout" id="layout">
  <aside class="rail" aria-label="Steps">
    <div class="rail-h">Steps</div>
    <ol id="railList"></ol>
    <p class="rail-f">Each step builds part of the request. Run it on the last step.</p>
  </aside>
  <main class="main" id="main"></main>
  <aside class="side" aria-label="Request so far">
    <div class="side-h"><span>Request so far</span><span class="dim" id="sideStep"></span></div>
    <pre id="sidePre"></pre>
    <p class="side-f">The JSON this step adds. Review shows the full request.</p>
  </aside>
</div>
<div class="sheet" id="sheet">
  <div class="panel">
    <div class="code-h"><span>Request so far</span><button type="button" class="lnk" id="sheetClose">Close</button></div>
    <pre id="sheetPre"></pre>
  </div>
</div>
<script src="/assets/session.js"></script>
<script type="module" src="/assets/sandbox.js"></script>
</body>
</html>
