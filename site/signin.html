<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Omnia.tax</title>
<link rel="icon" href="/logo/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/tokens.css" />
<link rel="stylesheet" href="/assets/site.css" />
<!--OMNIA_CONFIG-->
</head>
<body>
<div class="onboard">
  <aside class="step-panel">
    <div class="step-panel-top">
      <a class="logo" href="/" aria-label="Omnia.tax"><img src="/logo/logo-on-blue.svg" alt="" /></a>
      <span class="label-mono" style="color:var(--color-on-cobalt-muted);font-weight:400">Onboarding</span>
    </div>
    <div class="step-num-row"><div class="step-num" style="font-size:96px;letter-spacing:-4px">Sign in</div></div>
    <div class="step-rule"></div>
    <p>We’ll email a 6-digit code if this address has an account. The reply is the same either way.</p>
  </aside>
  <main class="form-col">
    <h1>Sign in.</h1>
    <p class="lead">Use the work email on your account. There is no password.</p>
    <form class="form-stack" id="form">
      <div class="field" id="emailField">
        <label class="field-label" for="email">Work email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@company.com" required />
        <p class="field-error" id="err" hidden></p>
      </div>
      <button class="btn btn-lg btn-primary btn-block" id="submit" type="submit">Email me a code <span class="btn-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h12M10 4l4 4-4 4" stroke="currentColor" stroke-width="2"/></svg></span></button>
    </form>
    <p class="form-foot">New here? <a class="btn btn-text" href="/signup">Create account</a></p>
  </main>
</div>
<script src="/assets/session.js"></script>
<script>
document.getElementById('form').addEventListener('submit', function (e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  var err = document.getElementById('err');
  err.hidden = true;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    err.textContent = 'Enter the work email you signed up with.';
    err.hidden = false;
    return;
  }
  var btn = document.getElementById('submit');
  Omnia.setLoading(btn, true);
  Omnia.api('/api/signin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email }) })
    .then(function (res) {
      Omnia.setLoading(btn, false);
      if (!res.ok) {
        err.textContent = (res.body && res.body.error) || 'Could not send a sign-in code.';
        err.hidden = false;
        return;
      }
      Omnia.setPending({ email: email, emailConfigured: !!(res.body && res.body.emailConfigured), sentAt: Date.now() });
      location.href = '/signup/verify?mode=signin';
    });
});
</script>
</body>
</html>
